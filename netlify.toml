# =========================================================================
# NETLIFY CONFIGURATION FOR PURE HTML/JS STATIC SITE (BLOGSPHERE)
# =========================================================================

[build]
  # Publish the root directory containing your HTML/JS files
  publish = "."

  # Secure build-time compilation of .env:
  # This command takes the Environment Variables you define in your Netlify
  # dashboard and writes them into a .env file during the deploy process.
  # This enables the browser to fetch the keys at runtime securely!
  command = 'echo "{\"SUPABASE_URL\": \"$NEXT_PUBLIC_SUPABASE_URL\", \"SUPABASE_KEY\": \"$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY\"}" > env.json'

[dev]
  # Netlify Dev configuration (for running 'netlify dev' locally)
  port = 8080
  publish = "."
