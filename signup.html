
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | BlogApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .signup-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      color: #333;
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      background: rgba(79, 70, 229, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      color: #4f46e5;
    }
    .btn-main {
      background: #4f46e5;
      border: none;
    }
    .btn-main:hover {
      background: #4338ca;
    }
    .link {
      color: #4f46e5;
    }
    .dark-swal-popup { background: #0f172a !important; }
    .dark-swal-title { color: white !important; }
    .dark-swal-text { color: #cbd5e1 !important; }
  </style>
</head>
<body>

<div class="signup-card">
  <div class="text-center mb-4">
    <div class="icon-circle">
      <i class="fas fa-user-plus"></i>
    </div>
  </div>
    <h2 class="mt-2">Register Here</h2>
    <p class="text-muted">Start sharing your thoughts today</p>

  <form id="signupForm">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" required placeholder="Ahmed Khan">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required placeholder="example@email.com">
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-main w-100 py-2 fw-bold">Create Account</button>
  </form>

  <p class="text-center mt-4 mb-0">
    Already have an account? <a href="login.html" class="link fw-bold">Login</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<script type="module" src="script.js"></script>
</body>
</html>
