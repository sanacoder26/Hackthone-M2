<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Author Studio - BlogSphere</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --dark-bg: #0f172a;
      --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      --hover-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.15);
      --glass-bg: rgba(255, 255, 255, 0.85);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar Glassmorphism */
    .navbar-premium {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .navbar-brand-premium {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .nav-link-premium {
      font-weight: 600;
      color: #475569 !important;
      padding: 0.5rem 1.25rem !important;
      border-radius: 9999px;
      transition: all 0.2s ease;
    }

    .nav-link-premium:hover, .nav-link-premium.active {
      color: #4f46e5 !important;
      background-color: rgba(79, 70, 229, 0.08);
    }

    /* Profile Header */
    .profile-header-studio {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      color: white;
      padding: 4.5rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid #4f46e5;
    }

    .profile-header-studio::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15), transparent 70%);
      z-index: 1;
    }

    .profile-content-wrapper {
      position: relative;
      z-index: 2;
    }

    .avatar-studio {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border: 5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .avatar-studio:hover {
      transform: scale(1.03);
      border-color: #6366f1;
    }

    .profile-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 2.25rem;
      margin-top: 1rem;
      letter-spacing: -0.5px;
    }

    .profile-role-badge {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      display: inline-block;
      margin-top: 0.5rem;
    }

    /* Cards */
    .card-blog-premium {
      border: 1px solid rgba(241, 245, 249, 1);
      border-radius: 20px;
      overflow: hidden;
      background-color: #ffffff;
      box-shadow: var(--card-shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card-blog-premium:hover {
      transform: translateY(-6px);
      box-shadow: var(--hover-shadow);
      border-color: rgba(124, 58, 237, 0.2);
    }

    .blog-img-container {
      position: relative;
      height: 180px;
      overflow: hidden;
      background-color: #f1f5f9;
    }

    .blog-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card-blog-premium:hover .blog-img {
      transform: scale(1.05);
    }

    .card-body-premium {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .blog-card-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .blog-card-text {
      color: #64748b;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .btn-premium {
      background: var(--primary-gradient);
      color: white;
      border: none;
      font-weight: 600;
      padding: 0.6rem 1.5rem;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
      transition: all 0.2s ease;
    }

    .btn-premium:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
      color: white;
    }

    .btn-premium-outline {
      background: transparent;
      color: #4f46e5;
      border: 2px solid #4f46e5;
      font-weight: 600;
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      transition: all 0.2s ease;
    }

    .btn-premium-outline:hover {
      background: rgba(79, 70, 229, 0.05);
      border-color: #7c3aed;
      color: #7c3aed;
    }

    /* Modal Form Customization */
    .form-control-premium {
      border: 2px solid #f1f5f9;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-control-premium:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .dark-swal-popup {
      border-radius: 20px !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    /* Footer styling */
    .footer-premium {
      margin-top: auto;
      background-color: #0f172a;
      color: #94a3b8;
      padding: 3rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

<!-- Premium Navbar -->
<nav class="navbar navbar-expand-lg navbar-premium">
  <div class="container">
    <a class="navbar-brand navbar-brand-premium" href="index.html">
      <i class="fas fa-feather-alt me-2"></i>BlogSphere
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-2 mt-3 mt-lg-0">
        <li class="nav-item"><a class="nav-link nav-link-premium" href="index.html">Home Feed</a></li>
        <li class="nav-item"><a class="nav-link nav-link-premium active" href="profile.html">My Studio</a></li>
        <li class="nav-item" id="authMenu">
          <button class="btn btn-premium-outline btn-sm ms-2" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Studio Profile Banner -->
<header class="profile-header-studio">
  <div class="container profile-content-wrapper">
    <img id="avatar" class="avatar-studio rounded-circle" src="https://via.placeholder.com/160?text=User" alt="Profile Avatar">
    <h2 id="fullName" class="profile-name">Loading Profile...</h2>
    <span class="profile-role-badge"><i class="fas fa-marker me-1"></i>BlogSphere Author</span>
  </div>
</header>

<!-- Dashboard Main Workspace -->
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
    <div>
      <h3 class="fw-bold mb-1">My Dashboard</h3>
      <p class="text-muted small mb-0">Create, update, and manage all your articles in one elegant workspace.</p>
    </div>
    <button class="btn btn-premium" id="newArticleBtn" data-bs-toggle="modal" data-bs-target="#blogModal">
      <i class="fas fa-plus-circle me-1"></i> New Article
    </button>
  </div>

  <div class="row g-4" id="myBlogs">
    <!-- User's articles will be rendered here dynamically -->
    <div class="col-12 text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading articles...</span>
      </div>
    </div>
  </div>
</main>

<!-- Unified Modal for Create/Edit -->
<div class="modal fade" id="blogModal" tabindex="-1" aria-labelledby="blogModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
      <div class="modal-header border-bottom-0 pb-0" style="padding: 2rem 2rem 0;">
        <h4 class="modal-title fw-bold" id="blogModalLabel" style="font-family: 'Outfit', sans-serif;">
          New Article
        </h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="blogForm">
        <div class="modal-body" style="padding: 2rem;">
          <input type="hidden" id="editId">
          <input type="hidden" id="existingImageUrl">
          
          <div class="mb-4">
            <label class="form-label fw-bold">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-premium" id="title" required placeholder="Write an engaging title for your article">
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-bold">Content <span class="text-danger">*</span></label>
            <textarea class="form-control form-control-premium" id="content" rows="8" required placeholder="Tell your story to the world..."></textarea>
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-bold">Cover Image (Optional)</label>
            <div class="d-flex align-items-center gap-3 mb-2">
              <button type="button" class="btn btn-outline-secondary btn-sm position-relative overflow-hidden">
                <i class="fas fa-image me-1"></i> Upload Cover
                <input type="file" id="image" accept="image/*" style="position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;">
              </button>
              <small class="text-muted">Max file size: 5MB (JPG/PNG)</small>
            </div>
            <img id="imagePreview" class="img-fluid rounded mt-2 border" style="max-height:220px; display:none; object-fit: cover; width: 100%;">
          </div>
        </div>
        
        <div class="modal-footer border-top-0 pt-0" style="padding: 0 2rem 2rem;">
          <button type="button" class="btn btn-outline-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-premium px-4" id="submitBtn">Publish Article</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Premium Footer -->
<footer class="footer-premium text-center">
  <div class="container">
    <p class="small mb-0">&copy; 2026 BlogSphere. Author Studio Workspace.</p>
  </div>
</footer>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Module logic -->
<script type="module" src="./profie.js"></script>

</body>
</html>
