<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>My Articles</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#blogModal">
      <i class="fas fa-plus"></i> New Article
    </button>
  </div>

  <div class="row g-4" id="myBlogs"></div>

<!-- Modal -->
<div class="modal fade" id="blogModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Article</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="blogForm">
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="title" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea class="form-control" id="content" rows="10" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Cover Image (optional)</label>
            <input type="file" class="form-control" id="image" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Publish</button>
        </div>
      </form>
    </div>
  </div>
</div>
