
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile | BlogSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background:#f8f9fa; }
    .profile-header { 
      background: linear-gradient(135deg, #667eea, #764ba2); 
      color:white; 
      padding:5rem 0; 
    }
    .avatar { 
      width:160px; 
      height:160px; 
      object-fit:cover; 
      border:6px solid white; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">BlogSphere</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="creat.html">New Post</a></li>
        <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
        <li class="nav-item" id="authMenu"></li>
      </ul>
    </div>
  </div>
</nav>

<div class="profile-header text-center">
  <img id="avatar" class="avatar rounded-circle mb-3" src="https://via.placeholder.com/160?text=User" alt="Profile">
  <h2 id="fullName">Loading...</h2>
</div>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <h3>My Articles</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#blogModal">
      <i class="fas fa-plus me-1"></i> New Article
    </button>
  </div>

  <div class="row g-4" id="myBlogs">
    <!-- Blogs will be loaded here -->
  </div>
</div>

<!-- Modal for Create/Edit -->
<div class="modal fade" id="blogModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Article</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="blogForm">
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label fw-bold">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="title" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">Content <span class="text-danger">*</span></label>
            <textarea class="form-control" id="content" rows="10" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Cover Image (optional)</label>
            <input type="file" class="form-control" id="image" accept="image/*">
            <img id="imagePreview" class="img-fluid mt-3 rounded" style="max-height:220px; display:none;">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Publish</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="./profie.js"></script>

</body>
</html>
